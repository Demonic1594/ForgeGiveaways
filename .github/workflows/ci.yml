name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Every test file with each database extension the giveaways can be stored
    # with: ForgeDB, and ReForgeDB (installed from GitHub, pinned in package.json).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        extension: [forge.db, reforge.db]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Builds dist/, then runs every test file (SQLite).
      - run: npm test
        env:
          GIVEAWAYS_TEST_EXTENSION: ${{ matrix.extension }}
      - run: npm run docgen
      # dist/ and metadata/ are committed so the package installs straight
      # from GitHub; fail if they don't match the sources.
      - name: Check that dist/ and metadata/ are up to date
        if: matrix.node == 22 && matrix.extension == 'forge.db'
        run: git diff --exit-code -- dist metadata

  # The oldest ForgeScript the peer range allows.
  forgescript-2-5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save @tryforge/forgescript@2.5.0
      - run: npm test

  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extension: [forge.db, reforge.db]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save pg
      - run: npm run build
      - name: Run the single-process test files against PostgreSQL
        env:
          PGPASSWORD: postgres
          GIVEAWAYS_TEST_EXTENSION: ${{ matrix.extension }}
        run: |
          for file in regression adversarial custom hardening; do
            psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE gw_$file"
            GIVEAWAYS_TEST_DB="{\"type\":\"postgres\",\"host\":\"127.0.0.1\",\"username\":\"postgres\",\"password\":\"postgres\",\"database\":\"gw_$file\"}" \
              node --test "test/$file.test.js"
          done
